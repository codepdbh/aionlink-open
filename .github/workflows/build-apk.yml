name: Build AionLink APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Locate Project & Build APK
        run: |
          # Find the directory containing settings.gradle
          PROJECT_DIR=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec dirname {} \; | head -n 1)
          echo "Detected project root at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          # Create missing local.properties for Android SDK
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          # Build using wrapper if present, otherwise use system gradle
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aionlink-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
